let simulation = null;

function init() {
    const select = document.getElementById('placeSelect');
    Object.keys(placeData).forEach(place => {
        const option = document.createElement('option');
        option.value = place;
        option.textContent = place;
        select.appendChild(option);
    });
    updateChart();
}

function updateChart() {
    const selectedPlace = document.getElementById('placeSelect').value;
    const data = placeData[selectedPlace];

    document.getElementById('districtInfo').textContent = data.district;
    document.getElementById('categoryInfo').textContent = data.category;

    if (simulation) simulation.stop();
    d3.select("#bubbleChart svg").remove();

    const width = 880;
    const height = 580;

    const svg = d3.select("#bubbleChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const tooltip = d3.select("#tooltip");

    // 필터 정의 (밝은 은은한 포커스 그림자)
    const defs = svg.append("defs");
    const filter = defs.append("filter")
        .attr("id", "soft-shadow")
        .attr("x", "-20%")
        .attr("y", "-20%")
        .attr("width", "140%")
        .attr("height", "140%");

    filter.append("feGaussianBlur")
        .attr("stdDeviation", "4")
        .attr("result", "blur");

    filter.append("feComposite")
        .attr("in", "SourceGraphic")
        .attr("in2", "blur")
        .attr("operator", "over");

    const maxVal = d3.max(data.keywords, k => k.value);
    const minVal = d3.min(data.keywords, k => k.value);

    // 가중치에 따른 반지름 계산
    const radiusScale = d3.scaleSqrt()
        .domain([minVal, maxVal])
        .range([28, 78]);

    // 초기 위치를 패킹 레이아웃으로 계산하여 별도의 폭발/등장 모션 없이 완벽 배치된 상태로 시작
    const pack = d3.pack()
        .size([width, height])
        .padding(4);

    const root = d3.hierarchy({ children: data.keywords })
        .sum(d => radiusScale(d.value))
        .sort((a, b) => b.value - a.value);

    const packedNodes = pack(root).leaves();

    const nodes = packedNodes.map(p => ({
        ...p.data,
        r: radiusScale(p.data.value),
        x: p.x,
        y: p.y
    }));

    // 무빙을 아주아주 천천히 제어하기 위한 초미세 Force 설정
    simulation = d3.forceSimulation(nodes)
        .force("center", d3.forceCenter(width / 2, height / 2).strength(0.005))
        .force("charge", d3.forceManyBody().strength(0.1))
        .force("collide", d3.forceCollide().radius(d => d.r + 3).iterations(2))
        .alphaTarget(0.02)  // 정지하지 않고 지속적으로 유영
        .alphaDecay(0.001)  // 감소 속도를 극도로 낮춤
        .velocityDecay(0.92); // 속도를 크게 낮춰 부드럽고 천천히 이동

    const nodeGroup = svg.selectAll(".node")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .style("cursor", "pointer");

    // 초기 위치 바로 적용 (등장 애니메이션 없음)
    nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);

    // 밝은 유리 버블 원 그리기
    nodeGroup.append("circle")
        .attr("r", d => d.r)
        .attr("fill", d => {
            const opacity = 0.45 + (d.value / maxVal) * 0.35;
            return `rgba(255, 255, 255, ${opacity})`;
        })
        .attr("stroke", d => {
            const strokeOpacity = 0.5 + (d.value / maxVal) * 0.4;
            return `rgba(59, 130, 246, ${strokeOpacity})`;
        })
        .attr("stroke-width", 1.8)
        .style("filter", "url(#soft-shadow)")
        .on("mouseover", function(event, d) {
            d3.select(this)
                .transition().duration(200)
                .attr("fill", "rgba(224, 242, 254, 0.9)")
                .attr("stroke", "#2563eb")
                .attr("stroke-width", 2.5);

            tooltip.style("opacity", 1)
                   .html(`<strong style="color:#0284c7; font-size:15px;">${d.name}</strong><br>검색 가중치: <span style="color:#d97706; font-weight:bold;">${d.value}</span>`);
        })
        .on("mousemove", (event) => {
            const [x, y] = d3.pointer(event, document.getElementById("bubbleChart"));
            tooltip.style("left", (x + 15) + "px")
                   .style("top", (y - 10) + "px");
        })
        .on("mouseout", function(event, d) {
            d3.select(this)
                .transition().duration(300)
                .attr("fill", `rgba(255, 255, 255, ${0.45 + (d.value / maxVal) * 0.35})`)
                .attr("stroke", `rgba(59, 130, 246, ${0.5 + (d.value / maxVal) * 0.4})`)
                .attr("stroke-width", 1.8);

            tooltip.style("opacity", 0);
        });

    // 텍스트 라벨 (키워드)
    nodeGroup.append("text")
        .text(d => d.name)
        .attr("text-anchor", "middle")
        .attr("dy", d => d.r > 32 ? "-0.2em" : "0.3em")
        .style("font-size", d => Math.min(d.r / 2.3, 15) + "px")
        .style("font-weight", "700")
        .style("fill", "#0f172a");

    // 가중치 값 라벨
    nodeGroup.filter(d => d.r > 32)
        .append("text")
        .text(d => `(${d.value})`)
        .attr("text-anchor", "middle")
        .attr("dy", "1.1em")
        .style("font-size", d => Math.min(d.r / 3.4, 11) + "px")
        .style("font-weight", "600")
        .style("fill", "#0284c7");

    // 아주아주 천천히 둥둥 떠다니는 초미세 시뮬레이션 tick
    // 무빙을 아주아주 천천히 제어하면서 부드러운 감속 효과 적용
    simulation = d3.forceSimulation(nodes)
        .force("center", d3.forceCenter(width / 2, height / 2).strength(0.003)) // 약한 중심 인력
        .force("charge", d3.forceManyBody().strength(-2)) // 버블 간 미세 밀어내기로 덜컹거림 완화
        .force("collide", d3.forceCollide().radius(d => d.r + 4).iterations(3)) // 충돌 경계 부드럽게
        .alphaTarget(0.015)   // 무한 유영 상태 유지
        .alphaDecay(0.0005)   // 극도로 천천히 에너지 감소
        .velocityDecay(0.96); // 속도 감쇄력을 높여 부드럽고 매끄러운 오일링 유영 느낌 연출

    // 덜컹거림 없는 부드러운 쿠션 경계 처리
    simulation.on("tick", () => {
        const padding = 10; // 벽과의 여유 공간
        
        nodes.forEach(d => {
            // 벽면 경계 접근 시 충격 흡수 (완충 쿠션 보간)
            if (d.x - d.r < padding) {
                d.x += (d.r + padding - d.x) * 0.1;
                d.vx *= 0.5; // 벽에 부딪힐 때 속도를 반으로 줄여 덜컥거림 제거
            } else if (d.x + d.r > width - padding) {
                d.x -= (d.x + d.r - (width - padding)) * 0.1;
                d.vx *= 0.5;
            }

            if (d.y - d.r < padding) {
                d.y += (d.r + padding - d.y) * 0.1;
                d.vy *= 0.5;
            } else if (d.y + d.r > height - padding) {
                d.y -= (d.y + d.r - (height - padding)) * 0.1;
                d.vy *= 0.5;
            }
        });

        // 위치 반영
        nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
    });
}

window.onload = init;
</script>
