<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate - 강원특별자치도 인기 관광지 & 세대별 분석</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-cream: #f7f3e8;
            --cream-dark: #eee9d8;
            --palette-deep: #1f06ac;
            --palette-mid: #0f42c0;
            --palette-light: #5882e8;
            --palette-yellow: #e3ef4f;
            --dark-text: #121629;
            
            --subtle-border: rgba(31, 6, 172, 0.15);
            --card-bg: #ffffff;
            --border-radius-lg: 32px;
            --border-radius-md: 20px;
            --transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-cream);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Header Navigation */
        header {
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-cream);
            border-bottom: 1px solid var(--subtle-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            background-color: var(--palette-deep);
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            background-color: var(--palette-mid);
            color: #fff;
            transform: translateX(-4px);
        }

        .brand-logo {
            font-family: 'Fredoka', cursive;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--palette-deep);
            text-decoration: none;
        }

        .header-tag {
            background-color: var(--palette-yellow);
            color: var(--palette-deep);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            border: 1px solid var(--subtle-border);
        }

        /* Layout Structure */
        .layout-wrapper {
            max-width: 1440px;
            margin: 2rem auto 4rem auto;
            width: 100%;
            padding: 0 1.5rem;
            display: flex;
            gap: 1.8rem;
            align-items: flex-start;
        }

        /* 1. Left Region Sidebar */
        .region-sidebar {
            width: 200px;
            background-color: #ffffff;
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-md);
            padding: 1rem 0.8rem;
            box-shadow: 0 8px 20px rgba(31, 6, 172, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            position: sticky;
            top: 90px;
            flex-shrink: 0;
        }

        .region-nav-btn {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            border: none;
            background-color: transparent;
            color: var(--dark-text);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .region-nav-btn:hover {
            background-color: var(--cream-dark);
            color: var(--palette-deep);
        }

        .region-nav-btn.active {
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            box-shadow: 0 4px 12px rgba(31, 6, 172, 0.2);
            font-weight: 800;
        }

        /* Right Content Area */
        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* SECTION: Split Box */
        .split-box {
            display: flex;
            gap: 1.8rem;
            align-items: stretch;
        }

        /* 2. Center Map Section */
        .map-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .map-wrapper {
            width: 100%;
            height: 100%;
            min-height: 680px;
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            border: 1px solid var(--subtle-border);
            box-shadow: 0 12px 32px rgba(31, 6, 172, 0.08);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #e5e3df;
        }

        .map-overlay-info {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 1rem 1.3rem;
            border-radius: 18px;
            border: 1px solid var(--subtle-border);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .map-overlay-info h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--palette-deep);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .map-overlay-info p {
            font-size: 0.85rem;
            color: #555;
            margin-top: 2px;
        }

        /* 3. Right List Section */
        .list-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            min-width: 0;
        }

        .list-header {
            background-color: var(--palette-yellow);
            color: var(--palette-deep);
            padding: 1.2rem 1.6rem;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--subtle-border);
            box-shadow: 0 6px 18px rgba(31, 6, 172, 0.06);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .list-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .list-header h1 {
            font-size: 1.45rem;
            font-weight: 800;
        }

        .list-header p {
            font-size: 0.88rem;
            color: var(--palette-deep);
            font-weight: 700;
            opacity: 0.85;
        }

        /* 연령대 필터 버튼 바 */
        .header-age-filter {
            display: flex;
            gap: 0.4rem;
            background-color: rgba(255, 255, 255, 0.65);
            padding: 0.3rem;
            border-radius: 14px;
            border: 1px solid var(--subtle-border);
            overflow-x: auto;
        }

        .age-filter-btn {
            flex: 1;
            padding: 0.45rem 0.6rem;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--palette-deep);
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            text-align: center;
        }

        .age-filter-btn:hover {
            background-color: rgba(31, 6, 172, 0.1);
        }

        .age-filter-btn.active {
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            box-shadow: 0 2px 8px rgba(31, 6, 172, 0.2);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.1rem;
        }

        .place-card {
            background-color: var(--card-bg);
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-md);
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(31, 6, 172, 0.04);
            text-decoration: none;
            color: inherit;
            position: relative;
            height: 110px;
            min-width: 0;
        }

        .place-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(31, 6, 172, 0.12);
            border-color: var(--palette-light);
            background-color: #ffffff;
        }

        .card-img-box {
            position: relative;
            width: 95px;
            height: 90px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--subtle-border);
            flex-shrink: 0;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .place-card:hover .card-img-box img {
            transform: scale(1.1);
        }

        .rank-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 25px;
            height: 25px;
            border-radius: 6px;
            background-color: var(--palette-deep);
            color: #fff;
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank-1 .rank-badge { background-color: var(--palette-deep); color: var(--palette-yellow); }
        .rank-2 .rank-badge { background-color: var(--palette-mid); color: #ffffff; }
        .rank-3 .rank-badge { background-color: var(--palette-light); color: #ffffff; }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
            padding: 0.1rem 0;
            min-width: 0;
            overflow: hidden;
        }

        .info-top h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--palette-deep);
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .category-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 6px;
            background-color: var(--cream-dark);
            color: var(--palette-deep);
            border: 1px solid rgba(31, 6, 172, 0.1);
            display: inline-block;
            margin-bottom: 0.2rem;
            width: fit-content;
        }

        .place-location {
            font-size: 0.8rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .search-count {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--palette-deep);
            white-space: nowrap;
        }

        /* MODAL STYLING & CUSTOM SCROLLBAR */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(18, 22, 41, 0.65);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 1.5rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: var(--bg-cream);
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-lg);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(15px) scale(0.97);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        /* 팝업창 감각적인 커스텀 스크롤바 디자인 */
        .modal-card::-webkit-scrollbar {
            width: 8px;
        }

        .modal-card::-webkit-scrollbar-track {
            background: var(--bg-cream);
            border-radius: 0 32px 32px 0;
        }

        .modal-card::-webkit-scrollbar-thumb {
            background-color: var(--palette-light);
            border-radius: 10px;
            border: 2px solid var(--bg-cream);
        }

        .modal-card::-webkit-scrollbar-thumb:hover {
            background-color: var(--palette-deep);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            transition: var(--transition);
        }

        .modal-close-btn:hover {
            background-color: var(--palette-mid);
            color: #ffffff;
            transform: rotate(90deg);
        }

        .modal-hero-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid var(--subtle-border);
        }

        .modal-body {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .modal-title-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .modal-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--palette-deep);
        }

        .modal-rank-tag {
            background-color: var(--palette-yellow);
            color: var(--palette-deep);
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            padding: 0.35rem 0.95rem;
            border-radius: 50px;
            font-size: 0.88rem;
            border: 1px solid var(--subtle-border);
        }

        .modal-location {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }

        .modal-description {
            background-color: #ffffff;
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-md);
            padding: 1.2rem 1.4rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            box-shadow: 0 4px 12px rgba(31, 6, 172, 0.03);
        }

        .modal-map-links {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .map-link-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.2rem;
            border-radius: 14px;
            border: 1px solid var(--subtle-border);
            font-weight: 800;
            font-size: 0.92rem;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .map-link-btn.kakao { background-color: #fee500; color: #191919; }
        .map-link-btn.naver { background-color: #03c75a; color: #ffffff; }

        .map-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .sns-tips-section {
            background-color: #ffffff;
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-md);
            padding: 1.3rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 4px 14px rgba(31, 6, 172, 0.04);
        }

        .sns-tips-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--palette-deep);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hashtag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .hashtag-chip {
            background-color: var(--bg-cream);
            color: var(--palette-deep);
            border: 1px solid var(--subtle-border);
            padding: 0.35rem 0.8rem;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .tip-card-box {
            background-color: var(--bg-cream);
            border-left: 4px solid var(--palette-deep);
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #444;
            line-height: 1.5;
        }

        .tip-card-box strong {
            color: var(--palette-deep);
            display: block;
            margin-bottom: 0.2rem;
        }

        .modal-video-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .modal-video-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--palette-deep);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: var(--border-radius-md);
            overflow: hidden;
            border: 1px solid var(--subtle-border);
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            text-align: center;
            padding: 2.2rem;
            background-color: var(--palette-deep);
            color: #ffffff;
            font-size: 0.88rem;
            margin-top: auto;
        }

        @media (max-width: 1024px) {
            .layout-wrapper { flex-direction: column; }
            .region-sidebar { width: 100%; flex-direction: row; overflow-x: auto; position: static; }
            .split-box { flex-direction: column; }
            .map-section { width: 100%; height: 420px; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="test2_p1.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> 메인페이지로 이동
        </a>
        <a href="#" class="brand-logo">TravelMate</a>
        <span class="header-tag"><i class="fa-solid fa-calendar-days"></i> 10월 인기 데이터</span>
    </header>

    <!-- Main Container Layout: Left Sidebar + Main Content -->
    <div class="layout-wrapper">

        <!-- 1. 좌측 광역지자체 사이드바 -->
        <aside class="region-sidebar">
            <button class="region-nav-btn" onclick="switchRegion('경기도')">경기도</button>
            <button class="region-nav-btn" onclick="switchRegion('서울특별시')">서울특별시</button>
            <button class="region-nav-btn" onclick="switchRegion('인천광역시')">인천광역시</button>
            <button class="region-nav-btn active" onclick="switchRegion('강원특별자치도')">강원특별자치도</button>
            <button class="region-nav-btn" onclick="switchRegion('경상남도')">경상남도</button>
            <button class="region-nav-btn" onclick="switchRegion('충청남도')">충청남도</button>
            <button class="region-nav-btn" onclick="switchRegion('경상북도')">경상북도</button>
            <button class="region-nav-btn" onclick="switchRegion('부산광역시')">부산광역시</button>
            <button class="region-nav-btn" onclick="switchRegion('전라남도')">전라남도</button>
            <button class="region-nav-btn" onclick="switchRegion('충청북도')">충청북도</button>
            <button class="region-nav-btn" onclick="switchRegion('전북특별자치도')">전북특별자치도</button>
            <button class="region-nav-btn" onclick="switchRegion('대구광역시')">대구광역시</button>
            <button class="region-nav-btn" onclick="switchRegion('제주특별자치도')">제주특별자치도</button>
            <button class="region-nav-btn" onclick="switchRegion('대전광역시')">대전광역시</button>
            <button class="region-nav-btn" onclick="switchRegion('광주광역시')">광주광역시</button>
            <button class="region-nav-btn" onclick="switchRegion('울산광역시')">울산광역시</button>
            <button class="region-nav-btn" onclick="switchRegion('세종특별자치시')">세종특별자치시</button>
        </aside>

        <!-- Main Content Area -->
        <main class="content-container">

            <!-- SECTION: Map & Top 10 Cards Split Box -->
            <div class="split-box">

                <!-- 2. Center 50%: Map -->
                <section class="map-section">
                    <div class="map-wrapper">
                        <div class="map-overlay-info">
                            <h2><i class="fa-solid fa-map-pin"></i> 강원특별자치도 인기 명소</h2>
                            <p>우측 카드를 클릭하면 상세 팝업 및 지도 위치로 연결됩니다.</p>
                        </div>
                        <div id="map"></div>
                    </div>
                </section>

                <!-- 3. Right 50%: Top 10 Cards Grid -->
                <section class="list-section">
                    
                    <div class="list-header">
                        <div class="list-header-top">
                            <h1 id="headerTitleText">강원도 인기 관광지 TOP 10</h1>
                            <p>카드를 클릭하면 상세 팝업창이 열립니다</p>
                        </div>

                        <!-- 20~60대 연령대 버튼 (한 줄) -->
